<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: white; /* Background color to match the navbar */
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 0.5rem 1rem;
      color: white;
    }
    .logo {
      font-size: 1.5rem;
    }
    .nav-links {
      display: flex;
      list-style: none;
      margin: 0; /* Reset margin */
      padding: 0; /* Reset padding */
    }
    .nav-links li {
      margin: 0 1rem;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }
    .burger {
      display: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
    }
    .burger div {
      width: 25px;
      height: 3px;
      background-color: white;
    }
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        background-color: #333;
        position: absolute;
        top: 60px;
        right: 0;
        width: 100%;
        padding: 0; /* Reset padding */
      }
      .nav-links li {
        padding: 10px 1rem; /* Add some padding for better appearance */
      }
      .nav-links.active {
        display: flex;
      }
      .burger {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">MyLogo</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <div class="burger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </nav>

  <script>
    function toggleMenu() {
      const navLinks = document.querySelector('.nav-links');
      navLinks.classList.toggle('active');
    }
  </script>
</body>
</html>
